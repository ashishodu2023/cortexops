version: "3.11"

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVICE_ROLE: web
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./cortexops.db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ENVIRONMENT: development
      DEBUG: "false"
      JWT_SECRET: dev-only-docker-compose-secret
      INTERNAL_API_KEY: dev_internal_key
    volumes:
      - ./backend:/app
      - ./sdk:/sdk
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python start.py
    environment:
      SERVICE_ROLE: worker
      CELERY_CONCURRENCY: "4"
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./cortexops.db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
      - ./sdk:/sdk
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
