# Celery worker service — link this config file in Railway (Settings → Config file path).
# Uses the same Dockerfile as the API; SERVICE_ROLE selects the worker process.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
runtime = "V2"
numReplicas = 1
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
startCommand = "SERVICE_ROLE=worker python start.py"
