name: CortexOps eval gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"   # daily regression sweep at 06:00 UTC

# Default token is read-only; eval-gate opts into pull-requests: write to comment on PRs.
permissions:
  contents: read

jobs:
  sdk-tests:
    name: SDK unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install SDK dev dependencies
        run: |
          cd sdk
          pip install -e ".[dev]"

      - name: Run SDK tests
        run: |
          cd sdk
          pytest tests/ -v --tb=short

  eval-gate:
    name: Eval gate — payments agent
    runs-on: ubuntu-latest
    needs: sdk-tests
    permissions:
      contents: read
      pull-requests: write  # sticky PR comment; fork PRs get a read-only token and skip it

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Dogfoods the published action from this checkout, against the SDK at this commit.
      - name: Run CortexOps eval gate
        id: eval
        uses: ./actions/eval-gate
        with:
          dataset: golden_v1.yaml
          agent: agent:build_agent()
          working-directory: examples/langgraph_payments
          cortexops-version: ./sdk
          fail-on: |
            task_completion < 0.85
            pass_rate < 1.0
          title: CortexOps eval — payments-agent

      - name: Upload eval results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: eval-results-${{ github.sha }}
          path: ${{ runner.temp }}/cortexops-eval-*/
          if-no-files-found: ignore
          retention-days: 30

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff==0.17.0
      - run: ruff check sdk/cortexops backend/app --line-length 121
