{{- if .Values.dashboard.enabled }}
{{- $ctx := dict "ctx" . "component" "dashboard" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cortexops.fullname" . }}-dashboard
  labels:
    {{- include "cortexops.componentLabels" $ctx | nindent 4 }}
  {{- with .Values.dashboard.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "cortexops.selectorLabels" $ctx | nindent 4 }}
{{- end }}
