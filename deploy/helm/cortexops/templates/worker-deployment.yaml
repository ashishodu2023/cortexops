{{- if .Values.worker.enabled }}
{{- $ctx := dict "ctx" . "component" "worker" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cortexops.fullname" . }}-worker
  labels:
    {{- include "cortexops.componentLabels" $ctx | nindent 4 }}
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "cortexops.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "cortexops.configChecksums" . | nindent 8 }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cortexops.componentLabels" $ctx | nindent 8 }}
        {{- with .Values.worker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cortexops.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "cortexops.apiImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- if .Values.worker.command }}
            {{- toYaml .Values.worker.command | nindent 12 }}
            {{- else }}
            - celery
            - -A
            - app.worker.celery_app.celery
            - worker
            - --loglevel={{ .Values.worker.logLevel }}
            - --concurrency={{ .Values.worker.concurrency }}
            {{- end }}
          envFrom:
            {{- include "cortexops.envFrom" . | nindent 12 }}
          env:
            - name: RUN_MIGRATIONS
              value: "0"
            {{- with (include "cortexops.dependencyEnv" .) }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.worker.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
