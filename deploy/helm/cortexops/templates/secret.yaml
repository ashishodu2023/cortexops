{{- if not .Values.secrets.existingSecret }}
{{- $name := include "cortexops.fullname" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := (get $existing "data") | default dict }}
{{- $redis := .Values.externalRedis }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "cortexops.labels" . | nindent 4 }}
type: Opaque
data:
  {{- /* Generated values are hex so they never contain "dev", which the API rejects in production. */}}
  JWT_SECRET: {{ if .Values.secrets.jwtSecret }}{{ .Values.secrets.jwtSecret | b64enc }}{{ else }}{{ (get $data "JWT_SECRET") | default (randAlphaNum 64 | sha256sum | b64enc) }}{{ end }}
  INTERNAL_API_KEY: {{ if .Values.secrets.internalApiKey }}{{ .Values.secrets.internalApiKey | b64enc }}{{ else }}{{ (get $data "INTERNAL_API_KEY") | default (randAlphaNum 64 | sha256sum | b64enc) }}{{ end }}
  {{- with .Values.externalDatabase.url }}
  DATABASE_URL: {{ . | b64enc }}
  {{- end }}
  {{- with $redis.url }}
  REDIS_URL: {{ . | b64enc }}
  {{- end }}
  {{- with (default $redis.url $redis.brokerUrl) }}
  CELERY_BROKER_URL: {{ . | b64enc }}
  {{- end }}
  {{- with (default $redis.url $redis.resultBackendUrl) }}
  CELERY_RESULT_BACKEND: {{ . | b64enc }}
  {{- end }}
  {{- with .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ . | b64enc }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.extraEnv }}
  {{ $key }}: {{ $value | toString | b64enc }}
  {{- end }}
{{- end }}
