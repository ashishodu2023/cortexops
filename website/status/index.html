<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Status — CortexOps</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/site.css">
  <style>
    .status-page{max-width:640px;margin:0 auto;padding:96px 28px 64px}
    .status-page h1{font-size:36px;margin-bottom:8px}
    .status-meta{font-size:13px;color:var(--faint);margin-bottom:32px}
    .status-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
    .status-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
    .status-row:last-child{border-bottom:none}
    .status-label{font-size:13px;color:var(--muted)}
    .status-val{font-family:var(--mono);font-size:13px;color:var(--text)}
    .status-pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;font-family:var(--mono)}
    .status-pill.ok{background:var(--green-light);color:var(--green)}
    .status-pill.bad{background:rgba(127,29,29,.35);color:var(--red-soft)}
    .status-pill.wait{background:rgba(255,255,255,.06);color:var(--faint)}
    .status-dot{width:7px;height:7px;border-radius:50%;background:currentColor}
    .status-links{display:flex;gap:16px;flex-wrap:wrap;margin-top:24px;font-size:13px}
    .status-links a{color:var(--brand-soft)}
  </style>
</head>
<body>
<nav class="nav">
  <a href="/" class="nav-brand">
    <div class="nav-mark"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M10 2.5 Q14 10 10 17.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M6 2.5 Q10.5 10 6 17.5" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity=".45"/>
      <circle cx="10" cy="2.5" r="1.8" fill="white"/><circle cx="10" cy="17.5" r="1.8" fill="white"/>
    </svg></div>
    <span>CortexOps</span>
  </a>
  <div class="nav-links"><a href="/">Home</a><a href="https://docs.getcortexops.com">Docs</a></div>
</nav>
<main class="status-page">
  <h1>System status</h1>
  <p class="status-meta" id="updated">Checking…</p>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">API</span>
      <span class="status-pill wait" id="api-pill"><span class="status-dot"></span>Checking</span>
    </div>
    <div class="status-row"><span class="status-label">Environment</span><span class="status-val" id="env">—</span></div>
    <div class="status-row"><span class="status-label">Version</span><span class="status-val" id="ver">—</span></div>
  </div>

  <div class="status-card">
    <div style="font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:8px">Circuit breakers</div>
    <div class="status-row"><span class="status-label">Stripe</span><span class="status-val" id="cb-stripe">—</span></div>
    <div class="status-row"><span class="status-label">Slack</span><span class="status-val" id="cb-slack">—</span></div>
    <div class="status-row"><span class="status-label">OpenAI</span><span class="status-val" id="cb-openai">—</span></div>
  </div>

  <div class="status-links">
    <a href="/api/" target="_blank" rel="noopener">API reference (Swagger)</a>
    <a href="https://docs.getcortexops.com#api-overview" target="_blank" rel="noopener">REST docs</a>
    <a href="/status/">Raw JSON</a>
  </div>
</main>
<script src="/site.js"></script>
<script>
(function () {
  const API = 'https://api.getcortexops.com/health';
  const pill = document.getElementById('api-pill');
  const setPill = (ok, text) => {
    pill.className = 'status-pill ' + (ok ? 'ok' : 'bad');
    pill.innerHTML = '<span class="status-dot"></span>' + text;
  };
  const setCb = (id, state) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = state || '—';
    el.style.color = state === 'closed' ? 'var(--green)' : state === 'open' ? 'var(--red-soft)' : 'var(--muted)';
  };
  fetch(API, { signal: AbortSignal.timeout(8000) })
    .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then((d) => {
      const ok = d.status === 'ok';
      setPill(ok, ok ? 'Operational' : 'Degraded');
      document.getElementById('env').textContent = d.environment || '—';
      document.getElementById('ver').textContent = d.version || '—';
      const c = d.circuits || {};
      setCb('cb-stripe', c.stripe);
      setCb('cb-slack', c.slack);
      setCb('cb-openai', c.openai);
      document.getElementById('updated').textContent =
        'Last checked ' + new Date().toLocaleString() + ' · auto-refresh every 60s';
    })
    .catch(() => {
      setPill(false, 'Unreachable');
      document.getElementById('updated').textContent = 'Could not reach API — try again shortly';
    });
  setInterval(() => location.reload(), 60000);
})();
</script>
</body>
</html>
